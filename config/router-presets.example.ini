[*]
# Global defaults inherited by every preset below (llama.cpp syntax).
flash-attn = on
jinja = true
cache-type-k = q8_0
cache-type-v = q8_0
temp = 1.0
top-p = 0.95
top-k = 20
min-p = 0.0
repeat-penalty = 1.05
threads = 16
reasoning = auto
reasoning-budget = -1
# Omit ngl on machines where VRAM is tight: llama.cpp's common_fit_params then
# offloads layers instead of aborting during a model-swap overlap.

[Qwen-27B-Q6K-96K]
model = ~/models/Qwen3.8-27B-Q6_K.gguf
ctx-size = 98304
parallel = 1
threads = 16
spec-type = draft-mtp
spec-draft-n-max = 2
load-on-startup = false

[Qwen-27B-Q4-32K]
# Smaller-context fallback for the same artifact.
model = ~/models/Qwen3.8-27B-Q4_K_XL.gguf
ctx-size = 32768
parallel = 1
threads = 12
load-on-startup = false
