name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -e ".[dev]"
      - name: config resolves and prints
        run: |
          python -c "import sys; sys.path.insert(0,'.'); from handoff_router import cli" # import check
          handoff-router --help
      - name: test suite (fake backends, no GPU required)
        run: pytest -q
